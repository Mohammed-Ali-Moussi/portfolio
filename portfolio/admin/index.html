<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>m0uss1 — Admin</title>
  <link rel="icon" type="image/png" href="../assets/logo.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0d0f;
      --panel: #121215;
      --card: #16161a;
      --line: #26262c;
      --txt: #e8e8ec;
      --muted: #8f8f9a;
      --accent: #D90429;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 14px;
    }
    .mono { font-family: "JetBrains Mono", monospace; }
    a { color: inherit; }
    button { font-family: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 1.2rem;
      background: rgba(13, 13, 15, 0.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .brand { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .brand b { color: var(--accent); }

    .tab-btn {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--txt); }
    .tab-btn.active {
      background: rgba(217, 4, 41, 0.14);
      border-color: rgba(217, 4, 41, 0.6);
      color: #fff;
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--txt);
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.pulse {
      box-shadow: 0 0 0 1px rgba(217, 4, 41, 0.5), 0 0 16px rgba(217, 4, 41, 0.35);
      animation: pulse 1.2s infinite;
    }
    .btn.primary {
      background: rgba(217, 4, 41, 0.16);
      border-color: rgba(217, 4, 41, 0.65);
      color: #fff;
    }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 1px rgba(217,4,41,.5); } 50% { box-shadow: 0 0 0 4px rgba(217,4,41,.22), 0 0 18px rgba(217,4,41,.4); } }

    .panel-wrap { max-width: 1120px; margin: 0 auto; padding: 1.2rem; }

    .item-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .item-top { display: grid; grid-template-columns: 190px 1fr auto; gap: 1rem; align-items: start; }
    @media (max-width: 760px) { .item-top { grid-template-columns: 1fr; } }

    .item-preview {
      aspect-ratio: 16/10;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0a0a0c;
      display: grid;
      place-items: center;
    }
    .item-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .item-preview .ph { color: #56565f; font-size: 0.75rem; }

    .item-fields { display: flex; flex-direction: column; gap: 0.55rem; min-width: 0; }
    .form-row { display: flex; flex-wrap: wrap; gap: 0.55rem; }
    .form-row label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .form-row label.grow { flex: 1; min-width: 160px; }
    .form-row label.col { flex: 1; min-width: 180px; }
    .form-row label.chk { flex-direction: row; align-items: center; gap: 0.4rem; align-self: flex-end; padding-bottom: 0.5rem; }
    .media-area { flex: 1; min-width: 260px; display: flex; align-items: flex-end; }

    .inp {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--txt);
      border-radius: 7px;
      padding: 0.45rem 0.6rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
    }
    .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px rgba(217, 4, 41, 0.4); }
    textarea.inp { resize: vertical; min-height: 34px; }
    .file-upload { padding: 0.35rem; }
    input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

    .item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; }
    .act {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .act:hover { border-color: var(--accent); color: var(--accent); }
    .act.danger:hover { border-color: var(--accent); color: #ff5a72; background: rgba(217, 4, 41, 0.12); }

    #translations-table { width: 100%; border-collapse: collapse; }
    #translations-table th {
      text-align: left;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 0.5rem 0.4rem;
      border-bottom: 1px solid var(--line);
    }
    #translations-table td { padding: 0.3rem 0.4rem; border-bottom: 1px solid #1b1b20; vertical-align: top; }
    #translations-table td code { color: var(--accent); font-size: 0.75rem; }
    #translations-table .group-row td {
      background: rgba(217, 4, 41, 0.08);
      border-bottom: 1px solid var(--line);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.45rem 0.4rem;
    }
    #translations-table .del-key { width: 30px; height: 30px; font-size: 0.75rem; }

    .toast {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 200;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      color: var(--txt);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transform: translateY(-6px);
      transition: all 0.25s;
      max-width: 340px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { border-left-color: #ffb454; }

    #preview-frame { width: 100%; height: calc(100vh - 140px); border: 1px solid var(--line); border-radius: 10px; background: #000; }
    .status-line { font-size: 0.72rem; color: var(--muted); }
    .toolrow { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">m0uss1<b>·admin</b></div>
    <div class="flex flex-wrap items-center gap-2">
      <span id="status-line" class="status-line mono"></span>
      <button class="tab-btn active" data-tab="items">Items</button>
      <button class="tab-btn" data-tab="translations">Translations</button>
      <button class="tab-btn" data-tab="preview">Preview</button>
      <button class="btn" id="backup-now">Backup</button>
      <select id="restore-list" class="inp" style="width:auto" disabled></select>
      <button class="btn" id="open-site">Open site ↗</button>
    </div>
  </div>

  <div class="panel-wrap">
    <div class="tab-panel" data-tab="items">
      <div class="toolrow">
        <button class="btn primary" id="add-item">＋ Add item</button>
        <button class="btn primary pulse" id="save-gallery" style="animation:none">💾 Save items</button>
        <span class="status-line mono">Ctrl/Cmd+S to save</span>
      </div>
      <div id="items-list"></div>
      <datalist id="types-datalist"></datalist>
    </div>

    <div class="tab-panel hidden" data-tab="translations">
      <div class="toolrow">
        <input type="text" id="new-key" class="inp" style="width:280px" placeholder="new.key.name  →  adds to EN + FR + TN" />
        <button class="btn" id="add-key">＋ Add key</button>
        <button class="btn primary" id="save-i18n">💾 Save translations</button>
        <span class="status-line mono">Darija (TN) column is RTL · delete any key with ✕</span>
      </div>
      <table id="translations-table">
        <thead>
          <tr><th style="width:220px">key</th><th>EN</th><th>FR</th><th>TN</th><th style="width:44px"></th></tr>
        </thead>
      </table>
    </div>

    <div class="tab-panel hidden" data-tab="preview">
      <div class="toolrow">
        <button class="btn" id="refresh-preview">⟳ Refresh</button>
      </div>
      <iframe id="preview-frame" src="../index.html" title="Portfolio preview"></iframe>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
